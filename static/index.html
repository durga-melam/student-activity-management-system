<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHRI VISHNU ENGINEERING COLLEGE FOR WOMEN :: IT Department Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #f1e5e9;
            border-radius: 16px;
            padding: 38px 34px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(131, 24, 67, 0.08);
            text-align: center;
        }
        .college-logo-img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .college-title {
            font-size: 14px;
            font-weight: 800;
            color: #831843;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .dept-title {
            font-size: 12px;
            color: #ea580c;
            font-weight: 700;
            margin: 4px 0 22px 0;
        }
        .form-heading {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .form-sub {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 22px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-control {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #fed7aa;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        .input-control:focus {
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #831843;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-signin:hover {
            background: #9d174d;
        }
        .quick-hint {
            margin-top: 20px;
            padding: 10px;
            background: #fff5f8;
            border-radius: 8px;
            border: 1px dashed #fbcfe8;
            font-size: 11px;
            color: #831843;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/static/svecw_logo.png" 
             alt="SVECW Logo" 
             class="college-logo-img" 
             onerror="this.onerror=null; this.src='/svecw_logo.png';">

        <div class="college-title">SHRI VISHNU ENGINEERING COLLEGE FOR WOMEN</div>
        <div class="dept-title">DEPARTMENT OF INFORMATION TECHNOLOGY</div>

        <h2 class="form-heading">Activity Portal Sign In</h2>
        <p class="form-sub">Student & Faculty Accreditation Management</p>

        <form id="loginForm" onsubmit="return directLogin(event)">
            <div class="input-group">
                <label for="username">Username / Roll Number *</label>
                <input type="text" id="username" class="input-control" placeholder="e.g. 22B01A1231" value="22B01A1231" required>
            </div>

            <div class="input-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="#" onclick="handleForgotPassword(event)" style="font-size: 11px; color: #ea580c; font-weight: 700; text-decoration: none;">Forgot Password?</a>
                </div>
                <input type="password" id="password" class="input-control" placeholder="Enter password" value="password123">
            </div>

            <button type="submit" id="signInBtn" class="btn-signin">Sign in</button>
        </form>

        <div class="quick-hint">
            <strong>🔑 Access Details:</strong><br>
            • Student: Enter Roll Number (e.g., <code>22B01A1231</code>)<br>
            • Incharge Faculty: Enter <code>rajesh</code> (Approval & Rejection Access)
        </div>
    </div>

    <script>
        function directLogin(e) {
            if (e) e.preventDefault();
            
            const unameInput = document.getElementById("username");
            const uname = (unameInput ? unameInput.value.trim() : "") || "22B01A1231";
            
            // 👉 ONLY RAJESH ANNA IS FACULTY
            const isRajesh = (uname.toLowerCase() === "rajesh");
            const userRole = isRajesh ? "FACULTY" : "STUDENT";
            
            localStorage.setItem("svecw_user", JSON.stringify({ 
                name: isRajesh ? "Rajesh Sir (Faculty Incharge)" : uname.toUpperCase(), 
                regd_no: uname.toUpperCase(),
                role: userRole
            }));
            
            window.location.href = "/dashboard";
            return false;
        }

        function handleForgotPassword(e) {
            if (e) e.preventDefault();
            alert("🔑 Password Reset Assistance:\n\nPlease contact IT Department Exam Cell / Faculty Incharge:\n📧 Email: itcoordinator@svecw.edu.in\n📞 Phone: 08816-250847\n🏢 Location: IT Department Office, SVECW");
        }
    </script>
</body>
</html>
